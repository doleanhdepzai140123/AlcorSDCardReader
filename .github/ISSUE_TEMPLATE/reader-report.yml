name: Reader compatibility report
description: Submit Alcor USB reader identity or macOS compatibility evidence.
title: "[Reader report]: "
body:
  - type: markdown
    attributes:
      value: |
        Windows-only reports are useful for identifying hardware, but cannot establish macOS compatibility. Remove serial numbers and unrelated machine details before posting.
  - type: input
    id: reader-model
    attributes:
      label: Reader or controller model
      description: Exact model if known; otherwise write Unknown.
      placeholder: Alcor AU6366
    validations:
      required: true
  - type: input
    id: usb-id
    attributes:
      label: USB vendor and product ID
      description: Use hexadecimal VID:PID, for example 058F:6366.
    validations:
      required: true
  - type: dropdown
    id: evidence-level
    attributes:
      label: Evidence level
      options:
        - Hardware identified on Windows only
        - macOS booted, card-reader behavior not working
        - Experimental macOS behavior observed
        - Complete macOS validation passed
    validations:
      required: true
  - type: input
    id: computer
    attributes:
      label: Computer model and platform
      description: Do not include serial numbers.
    validations:
      required: false
  - type: input
    id: macos
    attributes:
      label: macOS version and build
      placeholder: Ventura 13.x (build ...), or Not tested
    validations:
      required: true
  - type: textarea
    id: scsi
    attributes:
      label: SCSI inquiry data
      description: Include peripheral type, vendor, product, revision, and exact spacing when available. Write Not available if you only have Windows data.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results and evidence
      description: Describe which Apple services appeared and whether insertion, mount, read, write, eject, and reinsertion work. Attach only focused, redacted logs.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed USB serials, SMBIOS serials, MLB values, UUIDs, usernames, and unrelated EFI/configuration data.
          required: true
