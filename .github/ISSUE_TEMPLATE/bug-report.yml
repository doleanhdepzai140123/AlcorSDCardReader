name: Bug report
description: Report a reproducible problem with the project files or documentation.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the exact reader ID and the result you expected.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Computer model, macOS version/build, OpenCore version, OCAT version, and USB-map method. Do not post serial numbers.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and evidence
      description: List reproducible steps and attach focused, redacted logs.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed USB serials, SMBIOS serials, MLB values, UUIDs, usernames, and unrelated EFI/configuration data.
          required: true
